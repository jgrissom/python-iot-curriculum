<svg xmlns="http://www.w3.org/2000/svg" width="980" height="700" viewBox="0 0 980 700" font-family="Helvetica, Arial, sans-serif">
  <!-- Hand-authored, printable (white background). Edit the XML directly. -->
  <rect width="980" height="700" fill="#ffffff"/>

  <text x="490" y="34" font-size="20" font-weight="bold" text-anchor="middle" fill="#111">The vibration rig — 2N2222A low-side switch</text>

  <line x1="460" y1="52" x2="460" y2="668" stroke="#e5e7eb" stroke-width="2"/>
  <text x="230" y="66" font-size="14" font-weight="bold" text-anchor="middle" fill="#374151">Schematic</text>
  <text x="720" y="66" font-size="14" font-weight="bold" text-anchor="middle" fill="#374151">On the breadboard (row map)</text>

  <!-- ================= LEFT: SCHEMATIC ================= -->
  <!-- 3V3 rail -->
  <text x="126" y="93" font-size="13" font-weight="bold" text-anchor="end" fill="#b91c1c">3V3</text>
  <line x1="134" y1="88" x2="330" y2="88" stroke="#b91c1c" stroke-width="2.5"/>
  <circle cx="185" cy="88" r="3.5" fill="#111"/>
  <circle cx="300" cy="88" r="3.5" fill="#111"/>

  <!-- Motor -->
  <line x1="185" y1="88" x2="185" y2="122" stroke="#111" stroke-width="2"/>
  <circle cx="185" cy="152" r="30" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
  <text x="185" y="159" font-size="18" font-weight="bold" text-anchor="middle" fill="#111">M</text>
  <text x="140" y="147" font-size="11" text-anchor="end" fill="#6b7280">coin</text>
  <text x="140" y="160" font-size="11" text-anchor="end" fill="#6b7280">motor</text>
  <circle cx="185" cy="120" r="3" fill="#dc2626"/>
  <circle cx="185" cy="184" r="3" fill="#2563eb"/>
  <line x1="185" y1="182" x2="185" y2="285" stroke="#111" stroke-width="2"/>
  <text x="222" y="190" font-size="12" fill="#b91c1c">~80 mA ↓</text>

  <!-- Flyback diode branch (anode at bottom, cathode band at top = 3V3 side) -->
  <line x1="300" y1="88" x2="300" y2="168" stroke="#111" stroke-width="2"/>
  <line x1="286" y1="168" x2="314" y2="168" stroke="#111" stroke-width="4"/>
  <polygon points="288,202 312,202 300,172" fill="#111"/>
  <line x1="300" y1="202" x2="300" y2="285" stroke="#111" stroke-width="2"/>
  <line x1="300" y1="285" x2="185" y2="285" stroke="#111" stroke-width="2"/>
  <circle cx="185" cy="285" r="3.5" fill="#111"/>
  <text x="324" y="172" font-size="11" fill="#92400e">band toward 3V3 —</text>
  <text x="324" y="185" font-size="11" fill="#92400e">the only polarized part</text>
  <text x="324" y="205" font-size="12" font-weight="bold" fill="#111">1N914</text>

  <!-- Transistor: NPN, bar + C diag + E diag w/ arrow -->
  <line x1="185" y1="285" x2="185" y2="300" stroke="#111" stroke-width="2"/>
  <line x1="185" y1="300" x2="150" y2="325" stroke="#111" stroke-width="2"/>
  <line x1="150" y1="316" x2="150" y2="354" stroke="#111" stroke-width="5"/>
  <line x1="150" y1="345" x2="182" y2="369" stroke="#111" stroke-width="2"/>
  <polygon points="182,369 171,367 176,359" fill="#111"/>
  <line x1="185" y1="371" x2="185" y2="412" stroke="#111" stroke-width="2"/>
  <text x="196" y="303" font-size="12" font-weight="bold" fill="#374151">C</text>
  <text x="140" y="308" font-size="12" font-weight="bold" text-anchor="end" fill="#374151">B</text>
  <text x="196" y="384" font-size="12" font-weight="bold" fill="#374151">E</text>
  <text x="205" y="336" font-size="12" font-weight="bold" fill="#111">2N2222A</text>

  <!-- Base resistor + GPIO -->
  <line x1="48" y1="335" x2="78" y2="335" stroke="#d97706" stroke-width="2"/>
  <rect x="78" y="327" width="44" height="16" fill="#ffffff" stroke="#92400e" stroke-width="1.8"/>
  <text x="100" y="322" font-size="11" font-weight="bold" text-anchor="middle" fill="#92400e">1 kΩ</text>
  <line x1="122" y1="335" x2="150" y2="335" stroke="#111" stroke-width="2"/>
  <circle cx="48" cy="335" r="4" fill="#d97706"/>
  <text x="48" y="320" font-size="12" font-weight="bold" text-anchor="middle" fill="#d97706">GPIO 14</text>
  <text x="98" y="358" font-size="11" fill="#d97706">≈2.6 mA →</text>

  <!-- Ground symbol -->
  <line x1="167" y1="412" x2="203" y2="412" stroke="#111" stroke-width="3"/>
  <line x1="173" y1="419" x2="197" y2="419" stroke="#111" stroke-width="3"/>
  <line x1="179" y1="426" x2="191" y2="426" stroke="#111" stroke-width="3"/>
  <text x="185" y="444" font-size="12" font-weight="bold" text-anchor="middle" fill="#374151">GND</text>

  <!-- TO-92 pinout inset -->
  <rect x="40" y="500" width="400" height="112" rx="10" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="60" y="524" font-size="12" font-weight="bold" fill="#374151">Pinout check (TO-92)</text>
  <path d="M 120 578 L 120 550 Q 120 536 134 536 L 176 536 Q 190 536 190 550 L 190 578 Z" fill="#374151"/>
  <line x1="133" y1="578" x2="133" y2="598" stroke="#111" stroke-width="3"/>
  <line x1="155" y1="578" x2="155" y2="598" stroke="#111" stroke-width="3"/>
  <line x1="177" y1="578" x2="177" y2="598" stroke="#111" stroke-width="3"/>
  <text x="133" y="610" font-size="11" font-weight="bold" text-anchor="middle" fill="#111">E</text>
  <text x="155" y="610" font-size="11" font-weight="bold" text-anchor="middle" fill="#111">B</text>
  <text x="177" y="610" font-size="11" font-weight="bold" text-anchor="middle" fill="#111">C</text>
  <text x="210" y="558" font-size="12" fill="#111">flat face toward YOU, legs down</text>
  <text x="210" y="574" font-size="12" font-weight="bold" fill="#111">→ E - B - C, left to right</text>
  <text x="210" y="594" font-size="10" fill="#6b7280">silent rig with good wiring? spin it 180°</text>
  <text x="210" y="606" font-size="10" fill="#6b7280">(some 2N2222 variants are reversed)</text>

  <!-- ================= RIGHT: BREADBOARD ROW MAP ================= -->
  <!-- Motor + pigtail: blue wire to row 1 (top pin), red wire to row 2 -->
  <circle cx="560" cy="130" r="26" fill="#d1d5db" stroke="#6b7280" stroke-width="2"/>
  <circle cx="560" cy="130" r="9" fill="#9ca3af"/>
  <text x="560" y="88" font-size="11" font-weight="bold" text-anchor="middle" fill="#374151">coin motor</text>
  <text x="560" y="171" font-size="10" text-anchor="middle" fill="#6b7280">the puck: pre-assembled, handle by the chip</text>
  <path d="M 584 116 Q 622 132 642 165 Q 652 180 656 191" fill="none" stroke="#2563eb" stroke-width="1.8"/>
  <path d="M 585 142 Q 618 166 638 196 Q 650 210 656 222" fill="none" stroke="#dc2626" stroke-width="1.8"/>
  <text x="648" y="158" font-size="9" fill="#2563eb">blue</text>
  <text x="626" y="208" font-size="9" fill="#dc2626">red</text>
  <rect x="656" y="182" width="18" height="58" rx="2" fill="#111"/>
  <text x="665" y="174" font-size="10" text-anchor="middle" fill="#374151">2-pin header</text>
  <line x1="674" y1="193" x2="717" y2="193" stroke="#111" stroke-width="2.5"/>
  <line x1="674" y1="227" x2="717" y2="227" stroke="#111" stroke-width="2.5"/>

  <!-- Rows (7; row 3 left empty on purpose) -->
  <g>
    <rect x="700" y="180" width="240" height="26" rx="5" fill="#f9fafb" stroke="#d1d5db"/>
    <rect x="700" y="214" width="240" height="26" rx="5" fill="#f9fafb" stroke="#d1d5db"/>
    <rect x="700" y="248" width="240" height="26" rx="5" fill="#f9fafb" stroke="#d1d5db"/>
    <rect x="700" y="282" width="240" height="26" rx="5" fill="#f9fafb" stroke="#d1d5db"/>
    <rect x="700" y="316" width="240" height="26" rx="5" fill="#f9fafb" stroke="#d1d5db"/>
    <rect x="700" y="350" width="240" height="26" rx="5" fill="#f9fafb" stroke="#d1d5db"/>
    <rect x="700" y="384" width="240" height="26" rx="5" fill="#f9fafb" stroke="#d1d5db"/>
  </g>
  <text x="694" y="197" font-size="11" text-anchor="end" fill="#9ca3af">row 1</text>
  <text x="694" y="231" font-size="11" text-anchor="end" fill="#9ca3af">row 2</text>
  <text x="694" y="265" font-size="11" text-anchor="end" fill="#9ca3af">row 3</text>
  <text x="694" y="299" font-size="11" text-anchor="end" fill="#9ca3af">row 4</text>
  <text x="694" y="333" font-size="11" text-anchor="end" fill="#9ca3af">row 5</text>
  <text x="694" y="367" font-size="11" text-anchor="end" fill="#9ca3af">row 6</text>
  <text x="694" y="401" font-size="11" text-anchor="end" fill="#9ca3af">row 7</text>
  <!-- holes -->
  <g fill="#c4c8cf">
    <circle cx="720" cy="193" r="3"/><circle cx="748" cy="193" r="3"/><circle cx="776" cy="193" r="3"/><circle cx="804" cy="193" r="3"/><circle cx="832" cy="193" r="3"/>
    <circle cx="720" cy="227" r="3"/><circle cx="748" cy="227" r="3"/><circle cx="776" cy="227" r="3"/><circle cx="804" cy="227" r="3"/><circle cx="832" cy="227" r="3"/>
    <circle cx="720" cy="261" r="3"/><circle cx="748" cy="261" r="3"/><circle cx="776" cy="261" r="3"/><circle cx="804" cy="261" r="3"/><circle cx="832" cy="261" r="3"/>
    <circle cx="720" cy="295" r="3"/><circle cx="748" cy="295" r="3"/><circle cx="776" cy="295" r="3"/><circle cx="804" cy="295" r="3"/><circle cx="832" cy="295" r="3"/>
    <circle cx="720" cy="329" r="3"/><circle cx="748" cy="329" r="3"/><circle cx="776" cy="329" r="3"/><circle cx="804" cy="329" r="3"/><circle cx="832" cy="329" r="3"/>
    <circle cx="720" cy="363" r="3"/><circle cx="748" cy="363" r="3"/><circle cx="776" cy="363" r="3"/><circle cx="804" cy="363" r="3"/><circle cx="832" cy="363" r="3"/>
    <circle cx="720" cy="397" r="3"/><circle cx="748" cy="397" r="3"/><circle cx="776" cy="397" r="3"/><circle cx="804" cy="397" r="3"/><circle cx="832" cy="397" r="3"/>
  </g>

  <!-- Diode between rows 1 and 2 (band on row-2 side = the red/3V3 row) -->
  <line x1="776" y1="193" x2="776" y2="199" stroke="#111" stroke-width="2"/>
  <rect x="769" y="199" width="14" height="22" rx="3" fill="#fbbf24" stroke="#92400e"/>
  <rect x="769" y="215" width="14" height="6" fill="#111"/>
  <line x1="776" y1="221" x2="776" y2="227" stroke="#111" stroke-width="2"/>

  <!-- 3V3 jumper from row 2 (hops over the GND rail to the outer 3V3 rail) -->
  <path d="M 804 227 L 866 227 Q 878 212 890 227 L 898 227" fill="none" stroke="#dc2626" stroke-width="2.5"/>

  <!-- Collector jumper: row 1 (blue side) hops down to row 4 (transistor C) -->
  <path d="M 832 193 Q 874 244 832 295" fill="none" stroke="#4b5563" stroke-width="2.5"/>

  <!-- Transistor body left of legs, legs into rows 4/5/6 -->
  <rect x="706" y="284" width="26" height="90" rx="9" fill="#374151"/>
  <line x1="732" y1="295" x2="748" y2="295" stroke="#111" stroke-width="2.5"/>
  <line x1="732" y1="329" x2="748" y2="329" stroke="#111" stroke-width="2.5"/>
  <line x1="732" y1="363" x2="748" y2="363" stroke="#111" stroke-width="2.5"/>
  <text x="740" y="290" font-size="10" font-weight="bold" text-anchor="middle" fill="#374151">C</text>
  <text x="740" y="324" font-size="10" font-weight="bold" text-anchor="middle" fill="#374151">B</text>
  <text x="740" y="358" font-size="10" font-weight="bold" text-anchor="middle" fill="#374151">E</text>
  <text x="719" y="329" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle" transform="rotate(-90 719 329)">2N2222A</text>

  <!-- Resistor between rows 5 and 7 -->
  <line x1="804" y1="329" x2="804" y2="340" stroke="#111" stroke-width="2"/>
  <rect x="797" y="340" width="14" height="46" rx="4" fill="#fde68a" stroke="#92400e"/>
  <line x1="799" y1="350" x2="809" y2="350" stroke="#92400e" stroke-width="2"/>
  <line x1="799" y1="360" x2="809" y2="360" stroke="#92400e" stroke-width="2"/>
  <line x1="799" y1="370" x2="809" y2="370" stroke="#92400e" stroke-width="2"/>
  <line x1="804" y1="386" x2="804" y2="397" stroke="#111" stroke-width="2"/>
  <text x="818" y="368" font-size="10" font-weight="bold" fill="#92400e">1 kΩ</text>

  <!-- Rails (GND inner, 3V3 outer) -->
  <rect x="874" y="168" width="8" height="252" fill="#bfdbfe" stroke="#1e40af"/>
  <text x="878" y="162" font-size="10" font-weight="bold" text-anchor="middle" fill="#1e40af">GND</text>
  <rect x="898" y="168" width="8" height="252" fill="#fecaca" stroke="#b91c1c"/>
  <text x="902" y="162" font-size="10" font-weight="bold" text-anchor="middle" fill="#b91c1c">3V3</text>

  <!-- GND + GPIO jumpers -->
  <line x1="832" y1="363" x2="874" y2="363" stroke="#1e40af" stroke-width="2.5"/>
  <path d="M 832 397 Q 856 412 866 426" fill="none" stroke="#d97706" stroke-width="2.5"/>
  <text x="872" y="436" font-size="11" font-weight="bold" fill="#d97706">to GPIO 14</text>

  <!-- Row-map legend -->
  <g font-size="11.5" fill="#111">
    <text x="490" y="466"><tspan font-weight="bold">row 1</tspan> — motor <tspan font-weight="bold" fill="#2563eb">BLUE</tspan> pin · diode plain end · gray jumper down to row 4</text>
    <text x="490" y="486"><tspan font-weight="bold">row 2</tspan> — motor <tspan font-weight="bold" fill="#dc2626">RED</tspan> pin · diode <tspan font-weight="bold" fill="#92400e">BAND</tspan> end · red jumper → 3V3</text>
    <text x="490" y="506"><tspan font-weight="bold">row 3</tspan> — <tspan fill="#9ca3af">empty on purpose: elbow room between motor and transistor</tspan></text>
    <text x="490" y="526"><tspan font-weight="bold">row 4</tspan> — transistor <tspan font-weight="bold">C</tspan> · the gray jumper from row 1</text>
    <text x="490" y="546"><tspan font-weight="bold">row 5</tspan> — transistor <tspan font-weight="bold">B</tspan> · one leg of the 1 kΩ</text>
    <text x="490" y="566"><tspan font-weight="bold">row 6</tspan> — transistor <tspan font-weight="bold">E</tspan> · jumper → GND</text>
    <text x="490" y="586"><tspan font-weight="bold">row 7</tspan> — other leg of the 1 kΩ · jumper → GPIO 14</text>
  </g>
  <g font-size="10.5" fill="#6b7280">
    <text x="490" y="612">Any seven free rows work — the numbers are just names. Electrically either motor pin</text>
    <text x="490" y="628">works in either row (no polarity) — red → 3V3 is the class convention so every bench</text>
    <text x="490" y="644">matches. The diode band and the transistor legs DO have a right way around.</text>
    <text x="490" y="668" font-style="italic">Test: Pin(14).on() at the REPL → buzz. Silence? Legs, band, the gray jumper — in that order.</text>
  </g>
</svg>
